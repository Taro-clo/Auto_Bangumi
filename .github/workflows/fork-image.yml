name: Fork Image

# 仅供本 fork 使用：把带补丁的源码打成镜像并推到 GHCR，
# 不依赖上游的 DockerHub / ACCESS_TOKEN / UPDATE_SIGNING_KEY 等 secret。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（默认取 tag，去掉前缀 v）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sync dev dependencies
        working-directory: ./backend
        run: uv sync --group dev

      - name: Ruff check
        working-directory: ./backend
        run: uv run ruff check src

      - name: Ruff format check
        working-directory: ./backend
        run: uv run ruff format --check src

      - name: Mypy
        working-directory: ./backend
        run: uv run mypy src

      - name: Pytest
        working-directory: ./backend
        run: uv run pytest src/test -m "not e2e" -q

  build-webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Install
        working-directory: ./webui
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ./webui
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: webui/dist

  build-image:
    runs-on: ubuntu-latest
    needs: [version, test, build-webui]
    steps:
      - uses: actions/checkout@v4

      - name: Download webui dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/src/dist

      - name: Create version file
        working-directory: ./backend/src
        run: echo "VERSION='${{ needs.version.outputs.version }}'" >> module/__version__.py

      # ghcr 仓库名必须全小写，而 github.repository 保留了账号大小写
      - name: Resolve image name
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "image: $IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,scope=fork-image,ignore-error=true
